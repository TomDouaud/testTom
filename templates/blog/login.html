{% extends 'blog/base.html' %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="card p-4 shadow-lg" style="width: 100%; max-width: 400px; background-color: rgba(0, 0, 0, 0.85); border: 1px solid #d8c39e; border-radius: 10px;">
        <h2 class="text-center mb-4 text-warning" style="text-transform: uppercase; font-weight: bold;">Connexion</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3 text-white">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold">Se connecter</button>
        </form>
        <div class="mt-4 text-center">
            <a href="{% url 'password_reset_request' %}" class="text-decoration-none" style="color: #f39c12; font-size: 0.9rem;">Mot de passe oublié ?</a>
        </div>
    </div>
</div>
{% endblock %}
