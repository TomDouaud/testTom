<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BadassRadio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { padding-top: 60px; background-color: #121212; color: #f1f1f1; }
        .navbar { background-color: #1f1f1f; }
        .card { background-color: #2c2c2c; color: #fff; border: none; }
        a { color: #f39c12; text-decoration: none; }
        a:hover { color: #e67e22; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-md navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'home' %}">BadassRadio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'album_list' %}">Album of the Month</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'playlist_list' 'basic' %}">Playlists</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'playlist_list' 'movie' %}">Movie Soundtracks</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a href="{% url 'logout' %}" class="btn btn-outline-danger">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
