<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BadassRadio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    {% load static %}
    <style>
        body {
            padding-top: 60px;
            background-color: #000;
            background-image: url('{% static "images/bg.png" %}');
            background-attachment: fixed;
            background-size: cover;
            background-position: center top;
            color: #d8c39e;
            font-family: Arial, sans-serif;
        }
        .navbar { background-color: rgba(0, 0, 0, 0.8); border-bottom: 1px solid #d8c39e; }
        .navbar-brand, .nav-link { color: #d8c39e !important; font-weight: bold; }
        .nav-link:hover { color: #fff !important; }
        .card { background-color: rgba(0, 0, 0, 0.7); color: #d8c39e; border: 1px solid #d8c39e; }
        a { color: #f39c12; text-decoration: none; }
        a:hover { color: #e67e22; }
        h1, h2, h3, h4, h5, h6 { color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .list-group-item { background-color: rgba(0, 0, 0, 0.7) !important; color: #d8c39e !important; border-color: #d8c39e !important; }
        hr.border-secondary { border-top-color: #d8c39e !important; opacity: 0.5; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-md navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'home' %}">BadassRadio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'album_list' %}">Album of the Month</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'playlist_list' 'basic' %}">Playlists</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'playlist_list' 'movie' %}">Movie Soundtracks</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a href="{% url 'logout' %}" class="btn btn-outline-danger">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
