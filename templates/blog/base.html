<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BadassRadio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    {% load static %}
    <style>
        body {
            padding-top: 160px; /* Increased to account for taller image navbar */
            /* Linear gradient from #9a7341 to #e2b267 */
            background: linear-gradient(45deg, #9a7341 20%, #e2b267);
            /* Overlay the plouf image on top of the gradient, centered at the top */
            background-image: url('{% static "img/Plouf.png" %}'), linear-gradient(45deg, #9a7341 20%, #e2b267);
            background-attachment: fixed, fixed;
            background-size: auto, cover; /* Keep image natural size, cover for gradient */
            background-repeat: no-repeat, no-repeat;
            background-position: center top, center top;
            color: #d8c39e;
            font-family: Arial, sans-serif;
        }
        /* Make navbar fully transparent and remove border */
        .navbar { background-color: transparent !important; border-bottom: none !important; }
        .navbar-brand, .nav-link { color: #d8c39e !important; font-weight: bold; }
        .nav-link:hover { color: #fff !important; opacity: 0.8; }

        /* Ensure navbar links are images, set max-height to avoid them being too huge */
        .nav-image-link {
            height: 40px; /* Adjust as needed */
            width: auto;
            display: inline-block;
        }

        .navbar-brand .nav-image-link {
            height: 60px; /* Slightly larger for brand */
        }

        @media (max-width: 768px) {
            body {
                padding-top: 100px;
                background-size: contain, cover;
            }
            .nav-image-link {
                height: 30px;
            }
            .navbar-brand .nav-image-link {
                height: 40px;
            }
        }

        .card { background-color: rgba(0, 0, 0, 0.7); color: #d8c39e; border: 1px solid #d8c39e; }
        a { color: #f39c12; text-decoration: none; }
        a:hover { color: #e67e22; }
        h1, h2, h3, h4, h5, h6 { color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .list-group-item { background-color: rgba(0, 0, 0, 0.7) !important; color: #d8c39e !important; border-color: #d8c39e !important; }
        hr.border-secondary { border-top-color: #d8c39e !important; opacity: 0.5; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-md navbar-dark fixed-top">
        <div class="container-fluid" style="justify-content: center;">
            <a class="navbar-brand mx-3" href="{% url 'home' %}">
                <img src="{% static 'img/image.png' %}" alt="BadassRadio" class="nav-image-link">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation" style="position: absolute; right: 1rem;">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse" style="flex-grow: 0;">
                <ul class="navbar-nav mb-2 mb-md-0 d-flex align-items-center">
                    <li class="nav-item mx-3">
                         <a class="nav-link p-0" href="{% url 'playlist_list' 'playlist' %}" style="border: none; background: none;">
                            <img src="{% static 'img/Playlists.png' %}" alt="Playlists" class="nav-image-link" style="height: 35px;">
                        </a>
                    </li>
                    <li class="nav-item mx-3">
                         <a class="nav-link p-0" href="{% url 'playlist_list' 'bande_originale' %}" style="border: none; background: none;">
                            <img src="{% static 'img/BO.png' %}" alt="Bandes Originales" class="nav-image-link" style="height: 25px;">
                        </a>
                    </li>
                    <li class="nav-item mx-3">
                         <a class="nav-link" href="{% url 'playlist_list' 'mixtape' %}">
                            SURPRISES
                        </a>
                    </li>
                    <li class="nav-item mx-3">
                         <a class="nav-link" href="{% url 'album_list' %}">
                            ALBUMS DU MOIS
                        </a>
                    </li>
                </ul>
            </div>
            <div class="d-flex" style="position: absolute; right: 1rem;">
                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-danger">Déconnexion</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
