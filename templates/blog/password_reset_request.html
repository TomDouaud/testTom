{% extends 'blog/base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <h2>Request Password Reset</h2>
    <hr class="border-secondary">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    <div class="card bg-dark text-white border-secondary">
        <div class="card-body">
            <p>Enter your username below to request a password reset from the administrators.</p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <button type="submit" class="btn btn-warning w-100">Request Reset</button>
            </form>
            <div class="mt-3 text-center">
                <a href="{% url 'login' %}" class="text-secondary text-decoration-none">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
